[project]
name = "langchain-viktor"
version = "0.1.0"
description = "LangChain integration for Viktor, the AI employee: ChatViktor chat model, delegate tool, LangGraph handoff helper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["viktor-integrations-core>=0.1.0,<0.2", "langchain-core>=1.6,<2", "langchain-openai>=1.6,<2"]

[project.urls]
Source = "https://github.com/viktor-com/viktor-integrations/tree/main/python/langchain"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "langchain-tests>=1.1", "langchain>=1.0,<2", "langgraph>=1.0,<2"]

[tool.uv.sources]
viktor-integrations-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_viktor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: runs against the real Viktor API; needs VIKTOR_API_KEY"]
