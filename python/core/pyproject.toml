[project]
name = "viktor-integrations-core"
version = "0.1.0"
description = "Shared core for Viktor framework integrations: thin client, stream parsing, errors, tool-id routing, delegate tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viktor_integrations_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: runs against the real Viktor API; needs VIKTOR_API_KEY"]
