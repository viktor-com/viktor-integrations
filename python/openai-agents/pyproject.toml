[project]
name = "viktor-openai-agents"
version = "0.1.0"
description = "OpenAI Agents SDK integration for Viktor, the AI employee: model provider, delegate tool, handoff-ready Viktor agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["viktor-integrations-core>=0.1.0,<0.2", "openai-agents>=0.21,<1"]

[project.urls]
Source = "https://github.com/viktor-com/viktor-integrations/tree/main/python/openai-agents"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.sources]
viktor-integrations-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viktor_openai_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: runs against the real Viktor API; needs VIKTOR_API_KEY"]
