[project]
name = "viktor-integrations-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "langchain", "pydantic-ai", "openai-agents"]
exclude = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
"**/_spec.py" = ["E501"]
