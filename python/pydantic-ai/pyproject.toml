[project]
name = "pydantic-ai-viktor"
version = "0.1.0"
description = "Pydantic AI integration for Viktor, the AI employee: ViktorProvider, delegate toolset, ready-made Viktor agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["viktor-integrations-core>=0.1.0,<0.2", "pydantic-ai-slim[openai]>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.sources]
viktor-integrations-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_viktor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: runs against the real Viktor API; needs VIKTOR_API_KEY"]
